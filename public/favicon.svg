<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="JS monogram favicon">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#eef2ff" />
			<stop offset="100%" stop-color="#4f46e5" />
		</linearGradient>
		<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.44" />
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
		</linearGradient>
		<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.28" />
		</filter>
	</defs>

	<rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bg)" />
	<rect x="8" y="8" width="184" height="92" rx="44" fill="url(#shine)" />
	<rect x="8" y="8" width="184" height="184" rx="44" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2" />

	<text
		x="100"
		y="124"
		text-anchor="middle"
		fill="#0f172a"
		font-family="Avenir Next, Montserrat, Poppins, Segoe UI, sans-serif"
		font-size="88"
		font-weight="800"
		letter-spacing="-4"
		filter="url(#softShadow)"
	>JS</text>
</svg>